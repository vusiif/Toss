name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# A newer commit makes the run in flight pointless: cancel it instead of
# paying for two. Ten pushes to one PR should not be ten full runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The Linux leg is not redundancy: if core ever reaches for a
        # platform-exclusive API, this is the leg that refuses to compile (§10).
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain
        shell: bash
        run: |
          rustup set profile minimal
          rustup update --no-self-update stable
          rustup default stable
          rustup component add --toolchain stable rustfmt clippy

      # The native libraries zlib + liblzma + libarchive are keyed by their
      # real inputs — toolchain, configure flags, vendored sources, build.rs —
      # not by the per-invocation OUT_DIR, so clippy, tests and release all
      # share one build. rust-cache handles Rust dependencies; this handles
      # only what rust-cache deliberately does not: build-script output.
      - name: Cache native libraries
        uses: actions/cache@v4
        with:
          path: .native-cache
          key: ${{ runner.os }}-toss-native-${{ hashFiles('third_party/**', 'build.rs') }}
          restore-keys: |
            ${{ runner.os }}-toss-native-

      # Default behaviour, deliberately. build.rs compiles zlib, liblzma and
      # libarchive inside target/, so caching target/ caches the native build
      # too — no separate key, no extra directory to reason about.
      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        shell: bash
        run: cargo fmt --check

      - name: Clippy
        shell: bash
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Tests
        shell: bash
        run: cargo test --locked --all-features

      # Everything below is Windows-only. toss.exe is the product, so the
      # release build, the CLI behaviour it exercises and the size it records
      # are all Windows concerns; the Linux leg exists to refuse a core that
      # leans on a Windows-only API (§10), and a Linux binary is never shipped.
      - name: Release build
        if: runner.os == 'Windows'
        shell: bash
        run: cargo build --release --locked --all-features

      - name: Locate binary
        id: binary
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if [ -f target/release/toss.exe ]; then
            echo "path=target/release/toss.exe" >> "$GITHUB_OUTPUT"
          else
            echo "path=target/release/toss" >> "$GITHUB_OUTPUT"
          fi

      - name: Smoke test
        if: runner.os == 'Windows'
        shell: bash
        run: |
          bin="${{ steps.binary.outputs.path }}"

          # No arguments must be an error, not silence (§24), and diagnostics
          # belong on stderr so stdout stays machine-readable (§25).
          set +e
          message=$("$bin" 2>&1 >/dev/null)
          status=$?
          set -e

          echo "exit:  $status"
          echo "stderr: $message"

          if [ "$status" -ne 2 ]; then
            echo "::error::expected exit 2 (invalid arguments), got $status"
            exit 1
          fi
          if [[ "$message" != Error:\ * ]]; then
            echo "::error::expected 'Error: ...' on stderr, got: $message"
            exit 1
          fi

      - name: Record binary size
        if: runner.os == 'Windows'
        shell: bash
        run: |
          bin="${{ steps.binary.outputs.path }}"
          size=$(wc -c < "$bin")
          echo "$bin: $size bytes"
          {
            echo "### Binary size — ${{ matrix.os }}"
            echo
            echo "$bin: **$size bytes**"
          } >> "$GITHUB_STEP_SUMMARY"

  # `rust-version` in Cargo.toml is a promise that the oldest compiler we
  # claim to support still works. Without this job the promise quietly rots:
  # someone writes a newer construct, every CI run stays green because CI uses
  # stable, and the declared floor becomes a lie.
  #
  # One platform is enough for that claim. Compiler-floor failure and
  # Windows-specific behaviour are different questions, and the stable Windows
  # leg already owns the second — running MSRV on both platforms was proving
  # the same thing twice.
  msrv:
    name: MSRV (ubuntu-latest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Read the supported floor from Cargo.toml
        id: msrv
        shell: bash
        run: |
          # Cargo.toml is the single source of truth: bumping rust-version
          # there is what changes this job, and nothing here repeats the number.
          version=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          if [ -z "$version" ]; then
            echo "::error::rust-version is missing from Cargo.toml"
            exit 1
          fi
          case "$version" in
            *.*.*) ;;
            *) version="${version}.0" ;;
          esac
          echo "toolchain=$version" >> "$GITHUB_OUTPUT"
          echo "MSRV toolchain: $version"

      - name: Install the floor toolchain
        shell: bash
        run: |
          rustup set profile minimal
          rustup toolchain install "${{ steps.msrv.outputs.toolchain }}" --no-self-update

      # Same key as the stable jobs: the native libraries do not care which
      # Rust toolchain asked for them, so one cache serves all three jobs.
      - name: Cache native libraries
        uses: actions/cache@v4
        with:
          path: .native-cache
          key: ${{ runner.os }}-toss-native-${{ hashFiles('third_party/**', 'build.rs') }}
          restore-keys: |
            ${{ runner.os }}-toss-native-

      # After the toolchain install: the cache key includes the compiler
      # version, so the toolchain has to exist before the cache is addressed.
      - uses: Swatinem/rust-cache@v2

      # `check` is enough for a compiler-floor claim. Formatting and lints are
      # deliberately left to the stable job: rustfmt and clippy disagree with
      # themselves across releases, so pinning them here would fail the build
      # for reasons unrelated to the floor this job exists to protect. Tests
      # belong to the stable legs — running them again here only repeated them.
      - name: Check at the floor
        shell: bash
        run: cargo +${{ steps.msrv.outputs.toolchain }} check --locked --all-features
