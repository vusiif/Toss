[package]
name = "toss-sheet"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-or-later"
description = "Toss internal read-only spreadsheet viewer, selectively adapted from xleak"
publish = false

[dependencies]
calamine = { path = "../calamine", features = ["dates"] }
csv = "1.3"
encoding_rs = "=0.8.35"
regex = "1"
zip = { version = "=7.4.0", default-features = false, features = ["deflate"] }
quick-xml = "=0.39.4"
anyhow = "1.0"
comfy-table = "7.1"
ratatui = "0.29"
crossterm = "0.28"
chrono = "0.4"
arboard = "3.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "6"
