[package]
name = "toss"
version = "0.1.2"
edition = "2024"
rust-version = "1.92"
description = "Single-binary emergency file utility: drop a file on it, Toss does the safest useful thing."
repository = "https://github.com/vusiif/Toss"
license = "GPL-3.0-or-later"
readme = "README.md"
keywords = ["cli", "file", "archive", "viewer", "emergency"]
categories = ["command-line-utilities"]

# Measured full-feature release: smaller than ThinLTO with comparable runtime.
# Full LTO increases build/link time; debug builds retain their normal profile.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "debuginfo"

[features]
default = []

archive = ["dep:tempfile", "dep:libc"]
# Enables the image viewer. On Windows that is WIC + GDI through the
# `windows` dependency; everywhere else it is the portable viewer — bundled
# codecs and a winit/softbuffer window — whose dependencies are gated to
# non-Windows targets below, so neither side builds the other's stack.
image = [
    "dep:windows",
    "dep:image-codecs",
    "dep:winit",
    "dep:softbuffer",
    "dep:ratatui",
    "dep:ratatui-image",
]
# Enables Windows media playback on Media Foundation. Same shape and same
# reasoning as `image` (MEDIA_PLAYBACK.md §5): a build without it never
# hears of `windows` for this purpose, and everywhere else the capability
# answers exit 3 with the refusal Toss gives for what it was not built with.
media = ["dep:windows", "windows/Win32_System_Console"]
inspect = []
hash = []
spreadsheet = ["dep:toss-sheet"]
# Enables Word document viewing via vendored doxx (WORD_VIEWER.md §3, §4.C).
word = ["dep:doxx", "dep:rwml", "dep:cfb"]
# PDF pages share the native raster viewer; no external PDF application needed.
pdf = ["dep:hayro", "image"]
# Full-document DOCX conversion, sharing the existing PDF window.
word-pdf = ["word", "pdf", "dep:docxide-pdf", "dep:zip"]

native = []
portable = []

full = [
    "archive",
    "image",
    "media",
    "inspect",
    "hash",
    "word",
    "pdf",
    "word-pdf",
    "spreadsheet",
]

[dependencies]
toss-sheet = { path = "third_party/toss-sheet", optional = true }
tempfile = { version = "3", optional = true }
doxx = { path = "third_party/doxx", optional = true }
rwml = { version = "=0.1.4", default-features = false, optional = true }
cfb = { version = "0.10", optional = true }
hayro = { version = "=0.8.0", optional = true }
zip = { version = "=8.1.0", default-features = false, features = ["deflate"], optional = true }

# Target-gated rather than a plain dependency: `windows` does not compile on
# non-Windows targets, so a `[dependencies]` entry here would break the Linux
# leg of CI. Optional so that only the `image` feature pays for it — a build
# without the feature is byte-identical to one that never heard of it.
#
# Only the features Phase 6 and Phase 7 actually use are enabled; widening
# this list is a change to the dependency closure and needs a fresh decision
# (IMAGE_VIEWER.md §11, MEDIA_PLAYBACK.md §6 — the Media Foundation leaves
# below were accepted with D1 on 2026-10-01: 0 new crates, 0 lockfile
# change). `Win32`, `Win32_Graphics`, `Win32_System` and `Win32_UI` are
# implied parents of the leaves below.
#
# The three less obvious leaves are required by *signatures and cfgs*, not
# by calls: `IMFMediaSession::Start` and `IMFMediaEvent::GetValue` mention
# PROPVARIANT and VARIANT, `IMFSourceResolver::CreateObjectFromURL` mentions
# IPropertyStore — the interfaces cannot compile, and `Start` is not even
# emitted, without the types and features their declarations name, wherever
# P7-A passes null for them.
[target.'cfg(windows)'.dependencies]
# Word-to-PDF: third-party, and only where it already shipped. Other
# platforms wait for the project's own converter instead of wiring this.
docxide-pdf = { version = "=0.19.0", default-features = false, optional = true }
windows = { version = "0.62", optional = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Variant",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell_PropertiesSystem",
] }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

# The portable image viewer (platform/portable/image). Every system library
# underneath is loaded at run time — X11, Wayland and xkbcommon through
# dlopen — so one Linux binary starts on machines that have none of them and
# loses only the window (scripts/linux/check-portability.sh enforces this).
# Codecs are exactly the formats detection classifies as images.
[target.'cfg(not(windows))'.dependencies]
image-codecs = { package = "image", version = "0.25.9", default-features = false, features = ["png", "jpeg", "gif", "bmp"], optional = true }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen", "wayland-csd-adwaita-notitle"], optional = true }
softbuffer = { version = "0.4.8", default-features = false, features = ["x11", "x11-dlopen", "wayland", "wayland-dlopen"], optional = true }
# The no-display fallback draws in the terminal with the same ratatui stack
# the Word and spreadsheet viewers already ship (no new crates).
ratatui = { version = "0.29", default-features = false, features = ["crossterm"], optional = true }
ratatui-image = { version = "8.0", default-features = false, features = ["crossterm"], optional = true }

# Test the actual structured stdout with the same mature JSON parser already
# present in the runtime dependency graph; no extra runtime dependency.
[dev-dependencies]
serde_json = "1"

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "warn"

# Audited Word reader: retain QName validation, omit unused namespace snapshots.
[patch.crates-io]
xml-rs = { path = "third_party/xml-rs" }
