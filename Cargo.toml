[package]
name = "toss"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Single-binary emergency file utility: drop a file on it, Toss does the safest useful thing."
repository = "https://github.com/vusiif/Toss"
license = "GPL-3.0-or-later"
readme = "README.md"
keywords = ["cli", "file", "archive", "viewer", "emergency"]
categories = ["command-line-utilities"]

[features]
default = []

archive = []
# Enables the Windows image viewer, and with it the `windows` dependency
# below. The feature is empty on non-Windows targets because that dependency
# cannot be built there at all (IMAGE_VIEWER.md §3).
image = ["dep:windows"]
# Enables Windows media playback on Media Foundation. Same shape and same
# reasoning as `image` (MEDIA_PLAYBACK.md §5): a build without it never
# hears of `windows` for this purpose, and everywhere else the capability
# answers exit 3 with the refusal Toss gives for what it was not built with.
media = ["dep:windows"]
inspect = []
hash = []

native = []
portable = []

full = [
    "archive",
    "image",
    "media",
    "inspect",
    "hash",
]

[dependencies]

# Target-gated rather than a plain dependency: `windows` does not compile on
# non-Windows targets, so a `[dependencies]` entry here would break the Linux
# leg of CI. Optional so that only the `image` feature pays for it — a build
# without the feature is byte-identical to one that never heard of it.
#
# Only the features Phase 6 and Phase 7 actually use are enabled; widening
# this list is a change to the dependency closure and needs a fresh decision
# (IMAGE_VIEWER.md §11, MEDIA_PLAYBACK.md §6 — the Media Foundation leaves
# below were accepted with D1 on 2026-10-01: 0 new crates, 0 lockfile
# change). `Win32`, `Win32_Graphics`, `Win32_System` and `Win32_UI` are
# implied parents of the leaves below.
#
# The three less obvious leaves are required by *signatures and cfgs*, not
# by calls: `IMFMediaSession::Start` and `IMFMediaEvent::GetValue` mention
# PROPVARIANT and VARIANT, `IMFSourceResolver::CreateObjectFromURL` mentions
# IPropertyStore — the interfaces cannot compile, and `Start` is not even
# emitted, without the types and features their declarations name, wherever
# P7-A passes null for them.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", optional = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Variant",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell_PropertiesSystem",
] }

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
